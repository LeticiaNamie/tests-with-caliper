  numberOfAccounts: &number-of-accounts 1
  timeOfTest: &time-of-test 10

test:
  name: createDid Test (distribuido - manager + workers remotos via MQTT)
  description: >-
    Round unico de validacao do modo distribuido com 2 instancias Caliper
    (ver plano "Segunda instancia do Caliper, modo distribuido (MQTT)").
    workers.number eh o TOTAL combinado (locais na instancia A + remotos na B),
    nao o total de uma instancia so.
  workers:
    number: 20
  rounds:
    - label: createDid
      description: >-
        Test description for the opening of an account through the deployed
        contract.
      txDuration: *time-of-test
      rateControl:
        type: fixed-rate
        opts:
          tps: 2000
      workload:
        module: benchmarks/scenario/IndyDidRegistry/createDid.js
        arguments: *simple-args

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        interval: 5
        metrics:
          include: ["^node1$", "^node2$", "^node3$", "^node4$", "^node5$", "^node6$"]
          queries:
            - name: CPU(%)
              query: irate(process_cpu_seconds_total[10s])
              statistic: avg
              step: 1
              multiplier: 100
              label: instance
            - name: Memory(MB)
              query: process_resident_memory_bytes
              statistic: avg
              step: 1
              multiplier: 0.000001
              label: instance

observer:
  type: local
  interval: 5
